[package]
name = "perf-pilot"
version = "0.1.5"
description = "PerfPilot - AI-Native Performance Testing Platform"
authors = ["PerfPilot"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "perf_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
url = "2"
regex = "1"
once_cell = "1"

# keyring 3.x ships NO default features. Without an explicit platform
# backend macOS silently falls back to `mock` (an in-memory no-op):
# set_password "succeeds" and the key is gone after restart.
#
# These features are attached to the *dependency*, deliberately not
# re-exported as this crate's own optional features. Tauri CLI builds the
# app crate with `--no-default-features` (it re-passes whatever it needs),
# and a crate-level feature flag would silently turn the credential store
# off in exactly the builds that ship to users. Dependency features are
# applied by Cargo regardless. Verify with:
#   cargo tree --no-default-features -e features | grep keyring
#
# Every backend is target-gated inside keyring, so listing all three is
# safe for the macOS + Windows CI matrix. `crypto-rust` avoids an OpenSSL
# system dependency. Keep the sync/async secret-service features mutually
# exclusive — keyring compile_error!s if both are on.
keyring = { version = "3.6.3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
