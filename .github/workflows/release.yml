# Build PerfPilot installers for every supported platform.
#
# Triggers:
#   - push a tag matching `v*` (e.g. v0.1.0)
#   - manual dispatch from the Actions tab
#
# Output artifacts (per platform, uploaded separately so they can be
# downloaded independently):
#   macOS   → PerfPilot-macOS-arm64   (.dmg + .app)
#   Windows → PerfPilot-Windows-x64   (NSIS Setup.exe)
#
# Notes:
#   - `bundle.targets: "all"` in tauri.conf.json is resolved by Tauri's
#     build pipeline at compile time, so the same config produces
#     platform-appropriate bundlers (DMG on macOS, NSIS on Windows).
#   - The k6 sidecar binary is fetched per host via `scripts/fetch-k6.sh`
#     — it maps rustc's target triple to the matching GitHub release asset.
#   - No code signing yet. macOS notarization and Windows Authenticode
#     signing can be layered on later without changing this matrix.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed if/when a release-publish job is added later

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
            artifact: PerfPilot-macOS-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)
            artifact: PerfPilot-Windows-x64

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri's Windows bundler shells out to NSIS' `makensis`. It's not
      # preinstalled on `windows-latest` runners, so install it once per
      # job. Tauri's macOS bundler uses hdiutil which is built-in.
      - name: Install NSIS (Windows only)
        if: matrix.platform == 'windows-latest'
        run: choco install nsis -y --no-progress

      - name: Install npm dependencies
        run: npm ci

      # Drop the per-platform k6 sidecar next to the bundled binary. The
      # script auto-detects the rustc target triple, so the same line
      # works on both runners.
      - name: Fetch k6 sidecar
        run: bash scripts/fetch-k6.sh

      - name: Build Tauri bundle
        run: npx tauri build --target ${{ matrix.target }}

      # Tauri's built-in DMG bundler has a known arg bug on v2 (see
      # scripts/build-dmg.sh for context), so we re-bundle the .app with
      # `create-dmg` / `hdiutil` afterwards. Windows has no equivalent
      # workaround — the NSIS installer comes straight out of Tauri.
      # The triple arg tells the script where Tauri stashed the .app
      # (`target/<triple>/release/bundle/macos/...`).
      - name: Build DMG (macOS only)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-dmg.sh ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Ship the DMG only — it's the canonical macOS distribution
          # format (drag-to-Applications UX) and already contains the .app
          # compressed inside. Uploading both duplicates the k6 sidecar
          # in the artifact and inflates size from ~37 MB to ~73 MB.
          path: PerfPilot-*-arm64.dmg
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Publish a GitHub Release once all platform builds succeed. Skipped on
  # `workflow_dispatch` (those runs use refs/heads/main, not refs/tags/v*)
  # so manual re-runs of broken builds don't accidentally cut a release.
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: PerfPilot-macOS-arm64
          path: artifacts/macos

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: PerfPilot-Windows-x64
          path: artifacts/windows

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "PerfPilot ${{ github.ref_name }}"
          # `fail_on_unmatched_files: true` so a missing asset fails the
          # job loudly instead of producing a release with no installers.
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | 平台 | 文件 |
            | --- | --- |
            | macOS Apple Silicon | `PerfPilot-0.1.0-arm64.dmg` |
            | Windows x64 | `PerfPilot_0.1.0_x64-setup.exe` |

            k6 已随应用打包，无需单独安装。
          files: |
            artifacts/macos/*.dmg
            artifacts/windows/*.exe