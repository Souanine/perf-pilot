# Diagnostic workflow: Windows-only build to isolate whether the runner
# failure is macOS-specific or affects both. Safe to delete after.

name: Test (Windows-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: choco install nsis -y --no-progress
      - run: npm ci
      - run: bash scripts/fetch-k6.sh
      - run: npx tauri build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-Windows-x64-test
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error